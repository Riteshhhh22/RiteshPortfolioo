
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ritesh Indore · SOC Analyst &amp; Cybersecurity Professional</title>
<meta name="description" content="Ritesh Indore. SOC Analyst, MSc Cybersecurity at NCI Dublin. CompTIA Security+ certified. Specializing in SIEM, threat detection, and cloud security.">
<meta name="color-scheme" content="light">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fraunces:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #ffffff;
  --soft: #f8f8fa;
  --card: #ffffff;
  --primary: #e8683a;
  --dark: #c94e24;
  --hover: #d4513a;
  --light: rgba(232,104,58,.10);
  --accent: #ff8a5c;
  --text: #171719;
  --body: #45454d;
  --muted: #777780;
  --border: #e5e5e9;
  --strong: #d6d6dc;
  --ok: #34c38f;
  --li: #ff8a5c;
  --sans: 'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --serif: 'Fraunces',Georgia,serif;
  --mono: 'JetBrains Mono',ui-monospace,monospace;
  --sh: 0 4px 16px rgba(0,0,0,.08);
  --shl: 0 16px 48px rgba(232,104,58,.14);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  color-scheme: light;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

a {
  color: inherit;
  text-decoration: none;
}

a:focus-visible,
button:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 3px;
}

.i {
  width: 1em;
  height: 1em;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}

.i.f {
  fill: currentColor;
  stroke: none;
}

.s18 { font-size: 18px; }
.s22 { font-size: 22px; }
.s16 { font-size: 16px; }

nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255,255,255,.88);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--border);
}

.nav-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 1.1rem 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -.01em;
}

.logo-mark {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  background: linear-gradient(135deg,var(--primary),var(--accent));
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
  box-shadow: 0 4px 12px rgba(232,104,58,.25);
}

.logo-sub {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  font-weight: 400;
}

.nav-links {
  display: flex;
  gap: 2rem;
  list-style: none;
}

.nav-links a {
  color: var(--body);
  font-size: 14px;
  font-weight: 500;
  transition: color .2s;
}

.nav-links a:hover {
  color: var(--primary);
}

.nav-cta {
  background: var(--primary);
  color: #fff;
  padding: .55rem 1.1rem;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  transition: background .2s,transform .15s;
}

.nav-cta:hover {
  background: var(--hover);
  transform: translateY(-1px);
}

.hero {
  max-width: 1200px;
  margin: 0 auto;
  padding: 5rem 2rem;
  position: relative;
}

.hero::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 620px;
  height: 620px;
  background: radial-gradient(circle,rgba(232,104,58,.13),transparent 60%);
  pointer-events: none;
  z-index: -1;
}

.hero-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 4.5rem;
  align-items: center;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 7px 14px;
  background: var(--light);
  border: 1px solid rgba(232,104,58,.3);
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--dark);
  margin-bottom: 1.75rem;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--ok);
  animation: pulse 2s ease-out infinite;
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(52,195,143,.5); }
  70% { box-shadow: 0 0 0 8px rgba(52,195,143,0); }
  100% { box-shadow: 0 0 0 0 rgba(52,195,143,0); }
}

h1 {
  font-size: clamp(2.5rem,5.2vw,4.2rem);
  font-weight: 700;
  line-height: 1.05;
  letter-spacing: -.035em;
  margin-bottom: 1.5rem;
}

.serif {
  font-family: var(--serif);
  font-weight: 400;
  font-style: italic;
  color: var(--primary);
}

.hero-desc {
  font-size: 17px;
  line-height: 1.7;
  color: var(--body);
  margin-bottom: 1rem;
  max-width: 560px;
}

.hero-desc strong {
  color: var(--text);
  font-weight: 600;
}

.hero-now {
  font-size: 14.5px;
  color: var(--muted);
  margin-bottom: 2.1rem;
  max-width: 560px;
}

.hero-now b {
  color: var(--dark);
  font-weight: 600;
}

.hero-cta {
  display: flex;
  gap: .85rem;
  flex-wrap: wrap;
  margin-bottom: 2.5rem;
}

.btn {
  padding: .9rem 1.75rem;
  border-radius: 10px;
  font-size: 14.5px;
  font-weight: 600;
  transition: all .2s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid transparent;
}

.btn-primary {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 4px 14px rgba(232,104,58,.25);
}

.btn-primary:hover {
  background: var(--hover);
  transform: translateY(-1px);
}

.btn-secondary {
  background: var(--card);
  color: var(--text);
  border-color: var(--strong);
}

.btn-secondary:hover {
  border-color: var(--primary);
  color: var(--primary);
  transform: translateY(-1px);
}

.hero-trust {
  display: flex;
  gap: 2.25rem;
  flex-wrap: wrap;
  padding-top: 1.75rem;
  border-top: 1px solid var(--border);
}

.trust-value {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -.01em;
}

.trust-value span {
  color: var(--primary);
}

.trust-label {
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
}

.hero-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2rem;
  box-shadow: var(--shl);
  position: relative;
  overflow: hidden;
}

.hero-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 5px;
  background: linear-gradient(90deg,var(--primary),var(--accent));
}

.photo-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: .5rem 0 1.5rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 1.25rem;
}

.profile-photo {
  width: 210px;
  height: 210px;
  border-radius: 50%;
  object-fit: cover;
  object-position: center top;
  border: 4px solid var(--card);
  box-shadow: 0 0 0 4px var(--light),0 14px 36px rgba(232,104,58,.25);
  background: linear-gradient(135deg,var(--primary),var(--accent));
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 3.4rem;
  font-weight: 700;
}

.photo-name {
  margin-top: 1.1rem;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -.01em;
}

.photo-title {
  font-size: 13px;
  color: var(--muted);
  margin-top: 2px;
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 1rem;
  margin-bottom: .5rem;
}

.card-header-left {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .08em;
}

.card-badge {
  background: rgba(52,195,143,.12);
  color: var(--ok);
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}

.card-badge .dot {
  width: 6px;
  height: 6px;
  animation: none;
}

.prow {
  display: grid;
  grid-template-columns: 100px 1fr;
  padding: 10px 0;
  border-bottom: 1px dashed var(--border);
  gap: 12px;
  font-size: 13.5px;
}

.prow:last-child {
  border-bottom: none;
}

.prow .k {
  color: var(--muted);
  font-weight: 500;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .04em;
}

.prow .v {
  font-weight: 500;
}

.chip {
  display: inline-block;
  background: var(--light);
  color: var(--dark);
  padding: 2px 9px;
  border-radius: 5px;
  font-size: 11px;
  font-weight: 600;
  margin-right: 4px;
}

section {
  max-width: 1200px;
  margin: 0 auto;
  padding: 5.5rem 2rem;
}

.soft {
  background: var(--soft);
}

.soft > .inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 5.5rem 2rem;
}

.label {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  font-weight: 600;
  color: var(--primary);
  text-transform: uppercase;
  letter-spacing: .12em;
  margin-bottom: 1rem;
}

.label::before {
  content: '';
  width: 20px;
  height: 2px;
  background: var(--primary);
}

h2 {
  font-size: clamp(1.9rem,3.5vw,2.75rem);
  font-weight: 700;
  letterletter-spacing: -.025em;
  line-height: 1.15;
  margin-bottom: 1rem;
  max-width: 680px;
}

.lead {
  font-size: 16px;
  color: var(--body);
  max-width: 620px;
  margin-bottom: 3rem;
  line-height: 1.65;
}

.about-grid {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 4rem;
  align-items: start;
}

.about-text p {
  color: var(--body);
  font-size: 15.5px;
  line-height: 1.85;
  margin-bottom: 1.25rem;
}

.about-text strong {
  color: var(--text);
  font-weight: 600;
}

.hl {
  background: linear-gradient(180deg,transparent 60%,rgba(232,104,58,.25) 60%);
  padding: 0 2px;
  color: var(--text);
  font-weight: 600;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2rem;
  box-shadow: var(--sh);
}

.card h3.t {
  font-size: 13px;
  color: var(--muted);
  text-transform: uppercase;
  letterletter-spacing: .08em;
  margin-bottom: 1.5rem;
  font-weight: 600;
}

.hi {
  display: flex;
  gap: 14px;
  padding: 1rem 0;
  border-bottom: 1px solid var(--border);
}

.hi:first-of-type { padding-top: 0; }
.hi:last-child { border-bottom: none; padding-bottom: 0; }

.ico {
  flex-shrink: 0;
  width: 38px;
  height: 38px;
  background: var(--light);
  color: var(--primary);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hi-t { font-size: 14.5px; font-weight: 600; }
.hi-d { font-size: 12.5px; color: var(--muted); line-height: 1.5; }

.video-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1rem;
  box-shadow: var(--sh);
  max-width: 900px;
  margin: 0 auto;
}

.video-frame {
  aspect-ratio: 16/9;
  border-radius: 12px;
  overflow: hidden;
  background: linear-gradient(135deg,#c4472f,#e8683a 55%,#f08a5d);
  display: flex;
  align-items: center;
  justify-content: center;
}

.video-frame video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.vp {
  text-align: center;
  color: #fff;
  padding: 2rem;
}

.play {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: rgba(255,255,255,.15);
  border: 2px solid rgba(255,255,255,.4);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 1.25rem;
  font-size: 30px;
}

.vp h3 { font-size: 22px; margin-bottom: 8px; }
.vp p { font-size: 14px; color: rgba(255,255,255,.85); max-width: 380px; margin: 0 auto; }

.skills-grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 1.5rem;
}

.skill {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2rem;
  transition: transform .25s,box-shadow .25s;
}

.skill:hover,
.project:hover {
  transform: translateY(-3px);
  box-shadow: var(--shl);
}

.skill-h {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 1rem;
}

.skill h3 { font-size: 17px; font-weight: 600; }
.skill p { font-size: 13px; color: var(--muted); margin-bottom: 1.25rem; line-height: 1.55; }

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.tag {
  padding: 6px 12px;
  background: var(--soft);
  border: 1px solid var(--border);
  color: var(--body);
  font-size: 12.5px;
  font-weight: 500;
  border-radius: 6px;
}
